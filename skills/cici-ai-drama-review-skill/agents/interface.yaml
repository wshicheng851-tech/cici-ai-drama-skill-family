  short_description: "执行试拍验收、漂移诊断、批量门和成片终检。"
  default_prompt: "请依据锁定剧本、资产与逐镜表审核样片，按根因和优先级给单变量复测计划。"
compatibility:
  canonical_format: "Agent Skills SKILL.md"
